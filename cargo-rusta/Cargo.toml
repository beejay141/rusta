[workspace]
resolver = "2"

[package]
name = "cargo-rusta"
version = "0.1.0"
edition = "2021"
description = "Scaffold new Rusta API projects"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "cargo-rusta"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
handlebars = "5"
serde_json = "1"
anyhow = "1"
walkdir = "2"
