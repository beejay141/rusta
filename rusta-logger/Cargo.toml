[package]
name = "rusta-logger"
version = "0.1.0"
edition = "2021"
description = "Structured logging middleware for the Rusta framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beejay141/rusta"
keywords = ["logging", "structured-logging", "middleware"]
categories = ["development-tools", "development-tools::debugging"]
readme = "README.md"

[features]
default = ["axum-middleware"]
axum-middleware = ["dep:axum"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", optional = true }
log = "0.4"
rusta-di = { version = "0.1.0", path = "../rusta-di" }

[dev-dependencies]
tempfile = "3"